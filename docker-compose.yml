name: niche-opportunity-portal

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opportunity_portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal-db-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-opportunity_portal}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH: ${MAILPIT_SMTP_USER:-portal-smtp}:${MAILPIT_SMTP_PASSWORD:-portal-smtp-demo}
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_UI_AUTH: ${MAILPIT_UI_USER:-mailpit}:${MAILPIT_UI_PASSWORD:-mailpit-demo}
    volumes: [mailpit_data:/data]
    ports: ["8025:8025"]
    expose: ["1025"]

  # Internal-development IMAP mailbox. Its SMTP port is intentionally NOT exposed or mapped.
  # GreenMail test IMAP listens on 3143. User logs in as candidate@application.test.
  greenmail:
    image: greenmail/standalone:2.1.11
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=${DEV_IMAP_LOCALPART:-candidate}:${DEV_IMAP_PASSWORD:-candidate-imap-demo}@application.test
        -Dgreenmail.users.login=email
    ports: ["127.0.0.1:3143:3143"]


  stats_service:
    build: ./stats_service
    restart: unless-stopped
    environment:
      EXTERNAL_STATS_CONFIG: /config/external-stats.json
    volumes:
      - ./.scoutbox-runtime:/config:ro
    expose: ["8787"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2).read()\""]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: {WAIT_FOR_DB: "1", BOOTSTRAP_PORTAL: "1"}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${PORTAL_HOST_PORT:-80}:8000"]
    volumes: [media_data:/app/media, ./.scoutbox-runtime:/app/.scoutbox-runtime]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/login/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
      greenmail: {condition: service_started}

  # Background/default worker. Keep listening on the historical `celery` queue so
  # queued work published by older ScoutBox releases drains normally after upgrade.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: {WAIT_FOR_DB: "1", BOOTSTRAP_PORTAL: "0"}
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["celery", "-A", "opportunity_portal", "worker", "-l", "INFO", "--queues=celery", "--concurrency=2", "--prefetch-multiplier=1"]
    volumes: [media_data:/app/media, ./.scoutbox-runtime:/app/.scoutbox-runtime:ro]
    depends_on:
      web: {condition: service_healthy}


  # Direct telemetry sampler. It writes ResourceSample rows on its own 15-second
  # monotonic loop, independent of Celery Beat, Redis queue latency, and AI/search jobs.
  # That separation prevents the multi-hour collection holes seen in short-range charts.
  telemetry_sampler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: {WAIT_FOR_DB: "1", BOOTSTRAP_PORTAL: "0"}
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["python", "manage.py", "sample_resources", "--interval", "15"]
    volumes: [media_data:/app/media, ./.scoutbox-runtime:/app/.scoutbox-runtime:ro]
    depends_on:
      web: {condition: service_healthy}

  # Campaign discovery owns its own worker slots. A long campaign can therefore no
  # longer prevent Address Book enrichment, summaries, scans, or scheduler ticks from
  # obtaining a Celery worker slot.
  discovery_worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: {WAIT_FOR_DB: "1", BOOTSTRAP_PORTAL: "0"}
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["celery", "-A", "opportunity_portal", "worker", "-l", "INFO", "--queues=discovery", "--concurrency=5", "--prefetch-multiplier=1"]
    volumes: [media_data:/app/media, ./.scoutbox-runtime:/app/.scoutbox-runtime:ro]
    depends_on:
      web: {condition: service_healthy}

  # Forum/community discovery is supplementary. Keep it on a dedicated single-slot
  # worker so slow Reddit/forum requests can never consume the primary discovery slots.
  forum_worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: {WAIT_FOR_DB: "1", BOOTSTRAP_PORTAL: "0"}
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["celery", "-A", "opportunity_portal", "worker", "-l", "INFO", "--queues=forum", "--concurrency=1", "--prefetch-multiplier=1"]
    volumes: [media_data:/app/media, ./.scoutbox-runtime:/app/.scoutbox-runtime:ro]
    depends_on:
      web: {condition: service_healthy}

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: {WAIT_FOR_DB: "1", BOOTSTRAP_PORTAL: "0"}
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["celery", "-A", "opportunity_portal", "beat", "-l", "INFO"]
    volumes: [media_data:/app/media, ./.scoutbox-runtime:/app/.scoutbox-runtime:ro]
    depends_on:
      web: {condition: service_healthy}
      worker: {condition: service_started}
      telemetry_sampler: {condition: service_started}
      discovery_worker: {condition: service_started}
      forum_worker: {condition: service_started}

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  media_data:
